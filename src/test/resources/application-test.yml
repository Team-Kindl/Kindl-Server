spring:
  datasource:
    url: jdbc:h2:mem:kindl;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: UTC

jwt:
  secret: test-jwt-secret-key-for-testing-only-min-32-bytes
  access-token-expire-time: 3600000
  refresh-token-expire-time: 1209600000

oauth:
  google:
    client-ids: test-google-client-id
  kakao:
    client-ids: test-kakao-client-id
